source = ~/.config/hypr/mocha.conf

################
### MONITORS ###
################

monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$menu = wofi --show drun
$browser = firefox-developer-edition

#################
### AUTOSTART ###
#################

exec-once = waybar & hyprpaper &
exec-once = fcitx5 -d

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,22
env = GTK_THEME,catppuccin-mocha-mauve-standard+default
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = XMODIFIERS,@im=fcitx

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 3

    border_size = 0

    col.active_border = none
    col.inactive_border = none
    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 3
    rounding_power = 7

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }


    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = overShot,0.13,0.99,0.29,1.1
    bezier = easeOutSine,0.61,1,0.88,1
    animation = windows, 1, 2, overShot, slide
    animation = layers, 1, 1, easeOutSine, slide
    animation = workspaces, 1, 2, overShot, slide
    animation = fade, 0
    animation = border, 0
    animation = borderangle, 0
}

dwindle {
    pseudotile = false
    preserve_split = true
}

master {
    new_status = master
}

ecosystem {
    no_update_news = true
}
misc {
    vfr = true
    vrr = 1
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}

xwayland {
  force_zero_scaling = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

    repeat_rate = 125
    repeat_delay= 450

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, A, exec, $menu
bind = $mainMod, B, exec, $browser
bind = ALT, B, exec, killall waybar || waybar

bind = $mainMod, Q, killactive,
bind = $mainMod, DELETE, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod ALT, F, togglefloating,
bind = $mainMod, D, togglesplit,

bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, J, swapwindow, d
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, L, swapwindow, r

binde = $mainMod SHIFT, H, resizeactive, -3 0
binde = $mainMod SHIFT, J, resizeactive, 0 3
binde = $mainMod SHIFT, K, resizeactive, 0 -3
binde = $mainMod SHIFT, L, resizeactive, 3 0

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, 0, togglespecialworkspace, magic
bind = $mainMod SHIFT, 0, movetoworkspace, special:magic

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
